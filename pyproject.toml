[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lumenstitch"
version = "0.1.0"
description = "Multi-image registration with inspectable geometry and multiband panorama blending"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3","scipy>=1.12,<2","opencv-python-headless>=4.10,<6"]

[project.scripts]
lumenstitch = "lumenstitch.__main__:main"

[tool.setuptools]
packages = ["lumenstitch"]
